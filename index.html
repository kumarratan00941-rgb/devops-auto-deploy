<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List Web App | Ratan Kumar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .app-container {
      background: #1e293b;
      width: 100%;
      max-width: 480px;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .badge {
      background: #22c55e;
      color: #052e16;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }
    h2 { color: #38bdf8; font-size: 22px; margin-bottom: 4px; }
    .subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
    .input-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input {
      flex: 1;
      padding: 11px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
    }
    button.add-btn {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 11px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    button.add-btn:hover { background: #7dd3fc; }
    ul { list-style: none; }
    li {
      background: #0f172a;
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid #38bdf8;
    }
    li.completed span { text-decoration: line-through; color: #64748b; }
    li.completed { border-left-color: #22c55e; }
    .actions button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
      margin-left: 8px;
    }
    .footer {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #94a3b8;
    }
    .footer a { color: #38bdf8; text-decoration: none; }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="header">
      <div>
        <h2>To-Do List Manager</h2>
        <div class="subtitle">Ratan Kumar | Roll: 2401331540204</div>
      </div>
      <span class="badge">CI/CD v3.0</span>
    </div>

    <div class="input-box">
      <input type="text" id="taskInput" placeholder="Enter a new task...">
      <button class="add-btn" onclick="addTask()">Add</button>
    </div>

    <ul id="taskList"></ul>

    <div class="footer">
      <span>Container: NGINX Alpine</span>
      <a href="https://github.com/kumarratan00941-rgb/devops-auto-deploy" target="_blank">GitHub Repo ↗</a>
    </div>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem('devopsTasks')) || [
      { text: 'Configure Dockerfile with Alpine NGINX', done: true },
      { text: 'Set up GitHub Actions CI/CD Workflow', done: true },
      { text: 'Submit Project Report & Live Demo', done: false }
    ];

    function renderTasks() {
      const list = document.getElementById('taskList');
      list.innerHTML = '';
      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        if (task.done) li.classList.add('completed');
        li.innerHTML = `
          <span onclick="toggleTask(${index})" style="cursor:pointer;">${task.text}</span>
          <div class="actions">
            <button onclick="toggleTask(${index})" title="Complete">✅</button>
            <button onclick="deleteTask(${index})" title="Delete">🗑️</button>
          </div>
        `;
        list.appendChild(li);
      });
      localStorage.setItem('devopsTasks', JSON.stringify(tasks));
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      if (input.value.trim() === '') return;
      tasks.push({ text: input.value.trim(), done: false });
      input.value = '';
      renderTasks();
    }

    function toggleTask(index) {
      tasks[index].done = !tasks[index].done;
      renderTasks();
    }

    function deleteTask(index) {
      tasks.splice(index, 1);
      renderTasks();
    }

    document.getElementById('taskInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') addTask();
    });

    renderTasks();
  </script>
</body>
</html>
